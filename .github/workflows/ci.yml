name: CI

# The README's Verification section, run for every change instead of by whoever
# remembers. All three steps block, including the freshness lint: it flags reference
# docs older than 90 days by design, so when it goes red the fix is a real review of
# the doc against its primary source, then bumping its Updated tag — never the tag
# alone. (It ran as a warning until the 2026-09-03 review pass brought every doc
# current.)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Regression tests
        working-directory: scripts
        run: python -m unittest test_seo_skill
      - name: Environment doctor
        run: python scripts/doctor.py
      - name: Doc freshness lint
        run: python scripts/lint_freshness.py
