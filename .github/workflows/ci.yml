name: CI

# The README's Verification section, run for every change instead of by whoever
# remembers. The regression suite and the environment doctor block. The freshness
# lint is reported but does not block yet: it flags reference docs older than 90
# days by design, and several are past that today. Flip `continue-on-error` off
# once a review pass has brought them current — a gate that is red on arrival
# only teaches people to ignore red.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Regression tests
        working-directory: scripts
        run: python -m unittest test_seo_skill
      - name: Environment doctor
        run: python scripts/doctor.py
      - name: Doc freshness lint (warns only, see header)
        continue-on-error: true
        run: python scripts/lint_freshness.py
